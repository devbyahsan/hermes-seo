name: hermes-seo
version: "2.6.0"
description: "Free, open-source SEO audit skill for Hermes Agent. 26 sub-skills, 9 optional extensions, cross-platform Python tools. MIT."
license: MIT
author:
  name: "AgriciDaniel"
  url: https://github.com/AgriciDaniel
repository: https://github.com/devbyahsan/hermes-seo
homepage: https://claude-seo.md
requires_hermes: ">=0.21.5"
platforms: [linux, macos, windows]
python_requires: ">=3.11"
capabilities:
  skills:
    - seo
    - seo-audit
    - seo-technical
    - seo-content
    - seo-content-brief
    - seo-schema
    - seo-images
    - seo-sitemap
    - seo-geo
    - seo-plan
    - seo-programmatic
    - seo-competitor-pages
    - seo-hreflang
    - seo-local
    - seo-maps
    - seo-google
    - seo-backlinks
    - seo-cluster
    - seo-sxo
    - seo-drift
    - seo-ecommerce
    - seo-dataforseo
    - seo-image-gen
    - seo-flow
    - seo-agentic
    - seo-page
  provides_tools: []
  provides_hooks:
    - schema-validation (post_edit, post_write, post_save)
  requires_env: []
  config_schema: {}
