[project]
name = "hermes-seo"
version = "2.6.0"
description = "Comprehensive SEO analysis skill for Hermes Agent"
authors = [{name = "AgriciDaniel"}]
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
keywords = ["seo", "hermes-agent", "technical-seo", "content-quality", "schema-markup", "core-web-vitals"]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
